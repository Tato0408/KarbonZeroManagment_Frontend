<div class="py-4 px-2">
    <h2 class="general-title">
        Usuarios
    </h2>
    <div class="filters-bar d-flex align-items-center gap-3 p-3 mb-3 rounded-3 flex-nowrap" style="background:#f5f5f5;">
        <div class="input-group search-bar flex-grow-1" style="max-width: 400px;">
            <span class="input-group-text bg-transparent border-0"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control border-0 bg-transparent" placeholder="Buscar">
        </div>
        <div class="d-flex align-items-center gap-2 flex-nowrap ms-auto">
            <button class="kz-button-create" data-bs-toggle="modal" data-bs-target="#usersModal">
                <i class="bi bi-plus-circle"></i> Crear usuario
            </button>
        </div>
    </div>
    <div class="modal fade" id="usersModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalCenterTitle"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content kz-modal-mongo border-0">
                <div class="modal-header" style="justify-content: center; position: relative;">
                    <h4 class="kz-modal-title" id="exampleModalLongTitle">Usuarios</h4>
                    <button type="button" class="btn-close" style="position: absolute; right: 1rem; top: 1rem;"
                        data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>
                <form id="userForm">
                    <div class="modal-body mx-3">
                        <div class="row g-2 mb-3">
                            <div class="col-sm-6">
                                <label for="nombretxt" class="form-label">Nombre</label>
                                <input id="nombretxt" type="text" class="form-control" placeholder="Nombre">
                            </div>
                            <div class="col-sm-6">
                                <label for="apellidotxt" class="form-label">Apellido</label>
                                <input id="apellidotxt" type="text" class="form-control" placeholder="Apellido">
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-sm-6">
                                <label for="nombretxt" class="form-label">Usuario</label>
                                <input id="nombretxt" type="text" class="form-control" placeholder="Usuario">
                            </div>
                            <div class="col-sm-6">
                                <label for="apellidotxt" class="form-label">Contraseña</label>
                                <input id="apellidotxt" type="text" class="form-control" placeholder="Contraseña">
                            </div>
                        </div> 
                        <div class="row g-2 mb-3">
                            <div class="row g-2 mb-3">
                                <label for="nombretxt" class="form-label">Correo Electronico</label>
                                <input id="nombretxt" type="text" class="form-control" placeholder="Correo Electronico">
                            </div>
                        </div> 
                        <div class="row g-2 mb-3">
                            <div class="col-sm-6">
                                <label for="companitxt" class="form-label">Compañia</label>
                                <select id="companitxt" class="form-select">
                                    <option>...</option>
                                    <option>...</option>
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <label for="countrytxt" class="form-label">País</label>
                                <select id="countrytxt" class="form-select">
                                    <option>...</option>
                                    <option>...</option>
                                </select>
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="row g-2 mb-3">
                                <label for="imagen" class="form-label">Imagen</label>
                                <input type="file" class="form-control" id="imagen" accept="image/*">
                            </div>
                            <div class="row g-2 mb-3 d-flex align-items-center">
                                <img id="preview" src="#" alt="Vista previa" class="img-thumbnail" style="display:none; max-height: 100px;">
                            </div>
                            </div>
                        </div>
                    <div class="modal-footer d-flex justify-content-center">
                        <button type="submit" class="btn kz-button-create">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <ul class="nav nav-tabs mb-3" id="tabList"></ul>
    <div class="tab-content" id="tabContent"></div>
</div>
