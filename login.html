<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" href="./img/helloParrot.ico">

  <title>KarbonZeroManagement</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />

  <link rel="stylesheet" href="/css/globalGrid.css" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body class="d-flex justify-content-center align-items-center">
  <form class="container d-flex mx-4" id="login">
    <div id="left-side" class="col-12 col-md-6 justify-content-center px-5 text-center d-none d-md-flex flex-column">
      <img src="/img/logo.svg" alt="Logo Karbon Zero" class="img-fluid" />
      <h2>Bienvenido</h2>
      <p>Inicia tu camino hacia un futuro más sostenible</p>
      <br />
      <h4>KZ Administración</h4>
    </div>

    <div id="right-side" class="col-12 col-md-6 d-flex flex-column justify-content-evenly px-5">
      <h1 class="text-center">LogIn</h1>
      <div>
        <div class="login-entry py-2">
          <label for="usuariotxt" class="form-label">Usuario</label>
          <input type="text" id="usuariotxt" class="form-control py-2" />
        </div>
        <div class="login-entry py-2">
          <label for="contraseniatxt" class="form-label">Contraseña</label>
          <div class="input-group">
            <input type="password" id="contraseniatxt" class="form-control py-2" />
            <button class="btn" type="button" id="hide-password"><i class="bi bi-eye-fill"></i></button>
          </div>
        </div>
        <div class="login-checkbox py-2 d-flex justify-content-between flex-wrap">
          <a href="#passwordRecoveryModal" data-bs-toggle="modal" data-bs-target="#passwordRecoveryModal">
            Olvidaste tu contraseña?
          </a>
        </div>
      </div>
      <div class="d-flex justify-content-center">
        <button id="login-button" type="submit" class="kz-button-create my-3 p-3">Iniciar sesión</button>
      </div>
    </div>
  </form>
  <!-- Modal de recuperación -->
  <div class="modal fade" id="passwordRecoveryModal" tabindex="-1" aria-labelledby="passwordRecoveryLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content kz-modal-mongo border-0">
        <div class="modal-header justify-content-center position-relative">
          <h4 class="kz-modal-title" id="passwordRecoveryLabel">Recuperar contraseña</h4>
          <button type="button" class="btn-close position-absolute" data-bs-dismiss="modal" aria-label="Close"
            style="right: 1rem; top: 1rem;"></button>
        </div>

        <form id="passwordRecoveryForm">
          <div class="modal-body mx-3">

            <!-- FASE 1: ingreso de correo -->
            <div id="emailSection" class="mb-3">
              <label for="recoveryEmail" class="form-label">Correo electrónico</label>
              <div class="input-group">
                <input type="email" class="form-control" id="recoveryEmail" placeholder="Ingresa tu correo" required>
                <button class="btn btn-outline-secondary" type="button" id="sendCodeBtn">Enviar código</button>
              </div>
            </div>

            <!-- FASE 2: verificación y cambio de contraseña -->
            <div id="recoverySection" class="d-none">
              <div class="mb-3">
                <label for="recoveryCode" class="form-label">Código de verificación</label>
                <input type="text" class="form-control" id="recoveryCode" placeholder="Código recibido por correo">
              </div>
              <div class="mb-3">
                <label for="newPassword" class="form-label">Nueva contraseña</label>
                <input type="password" class="form-control" id="newPassword" placeholder="Ingresa nueva contraseña">
              </div>
              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirma tu contraseña">
              </div>
            </div>

          </div>
          <div class="modal-footer d-flex justify-content-center">
            <button type="submit" id="updatePasswordBtn" class="btn kz-button-create d-none">
              Actualizar contraseña
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="./js/login.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="/js/controllers/forgotPasswordController.js"></script>
<script type="module" src="/js/controllers/resetPasswordController.js"></script>
</html>
