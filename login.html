<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karbon Zero</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="../css/globalGrid.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body class="d-flex justify-content-center align-items-center">
    <div class="container d-flex mx-4">
      <div id="left-side" class="col-12 col-md-6 justify-content-center px-5 text-center d-none d-md-flex flex-column">
        <img src="../img/logo.svg" alt="Logo Karbon Zero">
        <h2>Bienvenido</h2>
        <p>Inicia tu camino hacia un futuro más sostenible</p>
        <br>
        <h4>KZ Administración</h4>
      </div>
      <div id="right-side" class="col-12 col-md-6 d-flex flex-column justify-content-evenly px-5">
        <h1 class="text-center">LogIn</h1>
        <div>
          <div class="login-entry py-2">
            <label for="usuariotxt" class="form-label">Usuario</label>
            <input
              type="text"
              name="usuariotxt"
              id="usuariotxt"
              class="form-control py-2"
            />
          </div>
          <div class="login-entry py-2">
            <label for="contraseñatxt" class="form-label">Contraseña</label>
            <div class="input-group">
              <input
              type="password"
              name="contraseñatxt"
              id="contraseñatxt"
              class="form-control py-2"
            />
            <button class="btn" type="button" id="hide-password"><i class="bi bi-eye-fill"></i></button>
          </div>
          </div>
          <div class="login-checkbox py-2 d-flex justify-content-between flex-wrap">
            <div>
              <input type="checkbox" name="" id="" class="form-check-input" />
              <label for="" class="form-check-label">Recuerdame</label>
            </div>
            <a href="#">Olvidaste tu contraseña?</a>
          </div>
        </div>
        <div class="d-flex justify-content-center">
          <button id="login-button" type="button" class="kz-button-create my-3 p-3">Iniciar sesión</button>
        </div>
      </div>
    </div>
  </body>
  <script src="../js/login.js"></script>
</html>
