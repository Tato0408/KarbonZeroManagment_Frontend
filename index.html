<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KarbonZero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans&display=swap" rel="stylesheet" />
    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/globalGrid.css" />
</head>

<body>
    <button class="menu-toggle" aria-label="Menú">
        <iconify-icon icon="mdi:menu"></iconify-icon>
    </button>

    <!-- Sidebar -->
    <aside class="sidebar d-flex flex-column p-3" id="sidebar">
        <div class="logo-placeholder">
            <img src="img/imagennn-removebg-preview.png" alt="Logo" class="img-fluid" />
        </div>
        <hr class="text-white" />
        <h6>Navegación</h6>

        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="#channel" class="nav-link">
                    <iconify-icon icon="mdi:message-text-outline" class="me-2"></iconify-icon> Canal
                </a>
            </li>
            <li>
                <a href="#measures" class="nav-link">
                    <iconify-icon icon="mdi:chart-bar" class="me-2"></iconify-icon> Medidas
                </a>
            </li>
            <div class="accordion" id="sidebarAccordion">
                <li>
                    <a class="nav-link d-flex justify-content-between align-items-center" data-bs-toggle="collapse"
                        href="#submenuPropiedades" role="button">
                        <span><iconify-icon icon="carbon:home" class="me-2"></iconify-icon> Propiedades</span>
                        <iconify-icon icon="mdi:chevron-down"></iconify-icon>
                    </a>
                    <div class="collapse" id="submenuPropiedades" data-bs-parent="#sidebarAccordion">
                        <a href="#pets" class="nav-link"><iconify-icon icon="mdi:paw"
                                class="me-2"></iconify-icon> Mascota</a>
                        <a href="#vehicles" class="nav-link"><iconify-icon icon="mdi:car"
                                class="me-2"></iconify-icon> Vehículo</a>
                        <a href="#houses" class="nav-link"><iconify-icon icon="mdi:home-city-outline"
                                class="me-2"></iconify-icon> Vivienda</a>
                    </div>
                </li>

                <li>
                    <a class="nav-link d-flex justify-content-between align-items-center" data-bs-toggle="collapse"
                        href="#submenuRecursos" role="button">
                        <span><iconify-icon icon="mdi:tools" class="me-2"></iconify-icon> Recursos</span>
                        <iconify-icon icon="mdi:chevron-down"></iconify-icon>
                    </a>
                    <div class="collapse" id="submenuRecursos" data-bs-parent="#sidebarAccordion">
                        <a href="#food" class="nav-link"><iconify-icon icon="mdi:food"
                                class="me-2"></iconify-icon> Alimentos</a>
                        <a href="#services" class="nav-link"><iconify-icon icon="mdi:flash"
                                class="me-2"></iconify-icon> Servicios</a>
                    </div>
                </li>

                <li>
                    <a class="nav-link d-flex justify-content-between align-items-center" data-bs-toggle="collapse"
                        href="#submenuOtros" role="button">
                        <span><iconify-icon icon="mdi:earth" class="me-2"></iconify-icon> Otros</span>
                        <iconify-icon icon="mdi:chevron-down"></iconify-icon>
                    </a>
                    <div class="collapse" id="submenuOtros" data-bs-parent="#sidebarAccordion">
                        <a href="#companies" class="nav-link"><iconify-icon icon="mdi:domain"
                                class="me-2"></iconify-icon> Compañías</a>
                        <a href="#contries" class="nav-link"><iconify-icon icon="mdi:flag"
                                class="me-2"></iconify-icon> Países</a>
                        <a href="#transport" class="nav-link"><iconify-icon icon="mdi:bus"
                                class="me-2"></iconify-icon> Transporte</a>
                        <a href="#users" class="nav-link text-white"><iconify-icon icon="mdi:account" 
                                class="me-2" width="18"></iconify-icon> Usuario</a>
                    </div>
                </li>
            </div>
            </li>
        </ul>
        <div class="mt-auto">
            <ul class="nav flex-column mb-0"
                style="list-style: none; padding-left: 0; font-size: 0.85rem; margin-top: 2rem;">
                <li class="nav-item mb-1"></li>
                <li class="nav-item">
                    <a id="logout" href="login.html" class="nav-link text-white">
                        <iconify-icon icon="mdi:logout" class="me-2" width="18"></iconify-icon> Cerrar sesión
                    </a>
                </li>
            </ul>
        </div>
    </aside>

    <main id="app" class="content-wrapper">
        <div class="container my-4">
        </div>
    </main>

   <script type="module" src="/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/layout.js"></script>
</body>

</html>
